<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Diwali</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            display: grid;
            place-items: center;
            background: linear-gradient(rgba(0, 0, 0, .45), rgba(0, 0, 0, .45)), url("dimg.jpg") center / cover fixed;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        main {
            width: min(760px, 100%);
            padding: 32px;
            border-radius: 16px;
            background: rgba(24, 17, 12, .76);
        }
        h1 {
            margin-top: 0;
        }
        p {
            line-height: 1.7;
        }
        audio {
            max-width: 100%;
            margin: 12px;
        }
        button {
            padding: 10px 16px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
        button:focus-visible {
            outline: 3px solid #ffd166;
            outline-offset: 3px;
        }
        @media (max-width: 480px) {
            main {
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Happy Diwali</h1>
        <p>May this Diwali bring peace and prosperity to your life.<br>
           Wishing you and your family a joyous and prosperous celebration.<br>
           May the festival brighten your life with happiness, health, and success.</p>
        <audio id="bgmusic" controls loop preload="none" aria-label="Diwali celebration music">
            <source src="daudio.mp3" type="audio/mpeg">
            Your browser does not support audio playback.
        </audio>
        <button id="play-music" type="button">Play music</button>
        <p id="audio-status" role="status" aria-live="polite"></p>
    </main>
    <script>
        const audio = document.getElementById('bgmusic');
        const playButton = document.getElementById('play-music');
        const audioStatus = document.getElementById('audio-status');

        playButton.addEventListener('click', async () => {
            try {
                await audio.play();
                audioStatus.textContent = 'Music is playing.';
            } catch (error) {
                audioStatus.textContent = 'Music could not be played. Use the audio controls to try again.';
                console.error('Unable to play Diwali music:', error);
            }
        });
    </script>
</body>
</html>
