<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decision Helper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Decision Helper</h1>
    <p>Compare two options using the priorities that matter to you.</p>

    <form id="decisionForm">
      <label for="question">What are you deciding?</label>
      <input type="text" id="question" placeholder="What's your decision?" required>
      <label for="optionA">Option A</label>
      <input type="text" id="optionA" placeholder="Option A" required>
      <label for="optionB">Option B</label>
      <input type="text" id="optionB" placeholder="Option B" required>
      <div class="form-actions">
        <button type="submit">Compare options</button>
        <button type="reset" id="resetBtn" class="secondary">Reset</button>
      </div>
    </form>

    <section id="results" class="hidden" aria-labelledby="resultsHeading">
      <h2 id="resultsHeading">Your decision</h2>
      <p id="displayQuestion"></p>
      <p id="displayOptions"></p>

      <div class="questions">
        <h3>Which option...</h3>
        <label for="q1">...costs less?</label>
        <select id="q1">
          <option value="">Choose an option</option>
          <option value="A">Option A</option>
          <option value="B">Option B</option>
        </select>
        <label for="q2">...saves more time?</label>
        <select id="q2">
          <option value="">Choose an option</option>
          <option value="A">Option A</option>
          <option value="B">Option B</option>
        </select>
        <label for="q3">...feels better to you?</label>
        <select id="q3">
          <option value="">Choose an option</option>
          <option value="A">Option A</option>
          <option value="B">Option B</option>
        </select>
        <button type="button" id="scoreBtn">Calculate score</button>
        <p id="scoreStatus" role="status" aria-live="polite"></p>
      </div>
      <p id="finalResult" class="highlight hidden" aria-live="polite"></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
